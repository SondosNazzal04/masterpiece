<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamFlow — Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark"></span>
      <span>TeamFlow</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">
        <div class="nav-group-label">Project</div>
        <a href="index.html" class="nav-link active">
          <span class="nav-dot"></span> Overview
        </a>
        <a href="tasks.html" class="nav-link">
          <span class="nav-dot"></span> Board
        </a>
        <a href="#" class="nav-link">
          <span class="nav-dot"></span> Team
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">Account</div>
        <a href="#" class="nav-link">
          <span class="nav-dot"></span> Skill Profiles
        </a>
        <a href="#" class="nav-link">
          <span class="nav-dot"></span> Settings
        </a>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="avatar">YA</div>
      <div class="sidebar-user">
        <div class="sidebar-user-name">Yazan Ahmad</div>
        <div class="sidebar-user-role">Team lead</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="crumb">Graduation project</div>
    </header>

    <main class="content">

      <!-- Project cover -->
      <div class="project-cover" id="projectCover" data-slug="forest">
        <div class="cover-inner">
          <div class="cover-text">
            <h1 class="cover-title" id="coverTitle">CampusConnect</h1>
            <div class="cover-meta">
              <span id="coverDeadline">Due Nov 06, 2026</span>
              <span class="cover-dot">·</span>
              <span id="coverProgressLabel">42% complete</span>
            </div>
          </div>
          <div class="cover-progress">
            <div class="cover-progress-fill" id="coverProgressFill" style="width:42%"></div>
          </div>
        </div>
      </div>
      <!-- Scope bar -->
      <div class="scope-bar">
        <select id="projectFilter">
          <option value="">All projects</option>
        </select>
        <select id="roleFilter">
          <option value="all">All tasks</option>
          <option value="assigned">Assigned to me</option>
        </select>
        <button class="btn-primary" id="createBtn" data-lead-only>+ Create Task</button>
      </div>

      <!-- Status counts -->
      <div class="hero-row">
        <div class="card ring-card">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="52" />
            <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"
                    stroke-dasharray="326.7" stroke-dashoffset="326.7" />
          </svg>
          <div class="ring-center">
            <div class="ring-num" id="ringNum">0</div>
            <div class="ring-label">complete</div>
          </div>
        </div>

        <div id="summary" class="summary"></div>
      </div>
      <!-- <div id="summary" class="summary"></div> -->

      <!-- Lead-only: workload -->
      <div class="card" style="margin-bottom:16px" data-lead-only>
        <h3>Workload per member</h3>
        <div id="workload" class="task-list"></div>
      </div>

      <!-- Member-only-ish: my tasks -->
      <div class="card" style="margin-bottom:16px">
        <h3>My upcoming tasks</h3>
        <div id="mine" class="task-list"></div>
      </div>

      <!-- Everyone: needs attention -->
      <div class="card" style="margin-bottom:16px">
        <h3>Needs attention</h3>
        <div id="attention" class="task-list"></div>
      </div>

      <!-- Everyone: per-project summary -->
      <div class="card">
        <h3>Across your projects</h3>
        <div id="acrossProjects" class="task-list"></div>
      </div>

    </main>
  </div>

  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
