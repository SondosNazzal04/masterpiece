<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamFlow — Project Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark"></span>
      <span>TeamFlow</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">
        <div class="nav-group-label">Project</div>
        <a href="index.html" class="nav-link">
          <span class="nav-dot"></span> Overview
        </a>
        <a href="tasks.html" class="nav-link active">
          <span class="nav-dot"></span> Board
        </a>
        <a href="insights.html" class="nav-link">
          <span class="nav-dot"></span> Insights
        </a>
        <a href="#" class="nav-link">
          <span class="nav-dot"></span> Team
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">Account</div>
        <a href="#" class="nav-link">
          <span class="nav-dot"></span> Skill Profiles
        </a>
        <a href="#" class="nav-link">
          <span class="nav-dot"></span> Settings
        </a>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="avatar">YA</div>
      <div class="sidebar-user">
        <div class="sidebar-user-name">Yazan Ahmad</div>
        <div class="sidebar-user-role">Team lead</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="crumb">Graduation project</div>
    </header>

    <main class="content">

      <h1 class="page-title">Board</h1>

      <div class="scope-bar">
        <select id="projectFilter">
          <option value="">All projects</option>
        </select>
        <select id="roleFilter">
          <option value="all">All tasks</option>
          <option value="assigned">Assigned to me</option>
        </select>
        <button class="btn-primary" id="createBtn" data-lead-only>+ Create Task</button>
      </div>

      <div id="board" class="board"></div>

    </main>
  </div>

  <!-- Task detail modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="assets/js/tasks.js"></script>
</body>
</html>
