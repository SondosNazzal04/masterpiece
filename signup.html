<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamFlow — Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-body">

  <div class="auth-shell">

    <div class="auth-form-side">
      <a href="landing.html" class="brand auth-brand">
        <span class="brand-mark"></span>
        <span>TeamFlow</span>
      </a>

      <form class="auth-form" id="signupForm" novalidate>
        <h1 class="auth-title">Create your account.</h1>
        <p class="auth-sub">Start your first project in under a minute.</p>

        <label class="field">
          <span class="field-label">Full name</span>
          <input type="text" name="name" class="field-input" placeholder="Yazan Ahmad" required minlength="2">
          <span class="field-error" data-error-for="name"></span>
        </label>

        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" name="email" class="field-input" placeholder="you@example.com" required>
          <span class="field-error" data-error-for="email"></span>
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" name="password" class="field-input" placeholder="At least 8 characters" required minlength="8">
          <span class="field-error" data-error-for="password"></span>
        </label>

        <button type="submit" class="btn-primary btn-block">Create account</button>

        <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </div>

    <aside class="auth-art-side">
      <div class="auth-art-mock">
        <div class="app-mock">
          <div class="mock-topbar">
            <span class="mock-dot"></span>
            <span class="mock-dot"></span>
            <span class="mock-dot"></span>
          </div>
          <div class="mock-body">
            <aside class="mock-side">
              <div class="mock-side-brand"></div>
              <div class="mock-side-item active"></div>
              <div class="mock-side-item"></div>
              <div class="mock-side-item"></div>
            </aside>
            <div class="mock-main">
              <div class="mock-cover"></div>
              <div class="mock-stats">
                <div class="mock-stat"></div>
                <div class="mock-stat"></div>
                <div class="mock-stat"></div>
              </div>
              <div class="mock-row">
                <div class="mock-task high">
                  <div class="mock-task-id"></div>
                  <div class="mock-task-title"></div>
                  <div class="mock-task-title short"></div>
                  <div class="mock-task-foot">
                    <div class="mock-avatar"></div>
                    <div class="mock-date"></div>
                  </div>
                </div>
                <div class="mock-task med">
                  <div class="mock-task-id"></div>
                  <div class="mock-task-title"></div>
                  <div class="mock-task-title short"></div>
                  <div class="mock-task-foot">
                    <div class="mock-avatar"></div>
                    <div class="mock-date"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    
      <div class="auth-art-quote">
        <p class="auth-quote">"Plan the work. Work the plan."</p>
        <p class="auth-quote-sub">TeamFlow keeps student teams moving — one small task at a time.</p>
      </div>
    </aside>

  </div>

  <script type="module" src="assets/js/signup.js"></script>
</body>
</html>
